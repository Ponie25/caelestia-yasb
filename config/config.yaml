watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: komorebic start --whkd
  stop_command: komorebic stop --whkd
  reload_command: komorebic stop --whkd && komorebic start --whkd
bars:
  status-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      center: false
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: true
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
      auto_hide: false
      hide_on_fullscreen: false
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - komorebi_control
      - bar_divider
      - komorebi_active_layout
      - bar_divider
      - komorebi_workspaces
      - bar_divider
      - active_window
      center: []
      right:
      - raycast_search
      - bar_divider
      - clock
      - bar_divider
      - control_center
    layouts:
      left:
        alignment: left
        stretch: true
      center:
        alignment: center
        stretch: false
      right:
        alignment: right
        stretch: true
widgets:
  cava:
    type: yasb.cava.CavaWidget
    options:
      bar_height: 20
      min_bar_height: 0
      gradient: 1
      foreground: '#b0b0b0'
      gradient_color_1: '#b8b8b8'
      gradient_color_2: '#b0b0b0'
      gradient_color_3: '#ffffff'
      bars_number: 24
      bar_spacing: 2
      bar_width: 3
      bar_type: bars
      framerate: 144
      hide_empty: false
  komorebi_control:
    type: komorebi.control.KomorebiControlWidget
    options:
      label: Ponie
      icons:
        start: "\uEAD3"
        stop: "\uEAD7"
        reload: "\uEAD2"
      run_ahk: false
      run_whkd: false
      run_masir: false
      show_version: true
      komorebi_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: '#3a3a3a'
        alignment: left
        direction: down
        offset_top: 6
        offset_left: 0
      label_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  komorebi_workspaces:
    type: komorebi.workspaces.WorkspaceWidget
    options:
      label_offline: Komorebi Offline
      label_workspace_btn: "\u2727"
      label_workspace_active_btn: "\u2726"
      label_workspace_populated_btn: "\u2726"
      label_default_name: ''
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: true
      animation: true
      toggle_workspace_layer:
        enabled: false
        tiling_label: Tiling
        floating_label: Floating
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
      btn_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  notes:
    type: yasb.notes.NotesWidget
    options:
      label: "<span>\uDB82\uDD0C</span> {count}"
      label_alt: '{count} notes'
      menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: '#3a3a3a'
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
        max_title_size: 150
        show_date_time: true
      icons:
        note: "\uDB82\uDD0C"
        delete: "\uEAB8"
        copy: "\uEBCC"
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      label_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: CPU
      label_alt: CPU {info[percent][total]:.0f}%
      progress_bar:
        enabled: true
        position: left
        size: 14
        thickness: 2
        color: '#c9c9c9'
        background_color: '#242424'
      update_interval: 2000
      callbacks:
        on_right: do_nothing
  grouped_widgets:
    type: yasb.grouper.GrouperWidget
    options:
      class_name: grouped-widgets
      widgets:
      - cpu
      - gpu
      container_padding:
        top: 0
        left: 2
        bottom: 0
        right: 6
  github:
    type: yasb.github.GithubWidget
    options:
      label: "<span>\uEBA1</span>"
      label_alt: Notifications {data}
      token: ""
      max_notification: 50
      notification_dot:
        enabled: true
        corner: bottom_left
        color: '#c8c8c8'
        margin:
        - 1
        - 1
      only_unread: false
      show_comment_count: false
      reason_filters: []
      max_field_size: 54
      update_interval: 300
      menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: '#3a3a3a'
        alignment: right
        direction: down
        show_categories: false
        categories_order:
        - PullRequest
        - Issue
        - CheckSuite
        - Release
        - Discussion
      label_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  media:
    type: yasb.media.MediaWidget
    options:
      label: "<span>\uF001</span> {title}"
      label_alt: "<span>\uDB80\uDF87</span> {title}"
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: do_nothing
        on_right: toggle_label
      max_field_size:
        label: 40
        label_alt: 80
      show_thumbnail: false
      controls_only: false
      controls_left: true
      thumbnail_alpha: 80
      thumbnail_padding: 0
      thumbnail_corner_radius: 8
      thumbnail_edge_fade: true
      scrolling_label:
        enabled: false
        update_interval_ms: 100
        style: left
        separator: ' | '
        label_padding: 0
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      icons:
        prev_track: "\uDB81\uDCAE"
        next_track: "\uDB81\uDCAD"
        play: "\uDB81\uDC0A"
        pause: "\uDB80\uDFE4"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: '#3a3a3a'
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 4
        thumbnail_size: 80
        max_title_size: 80
        max_artist_size: 20
        show_source: true
      media_menu_icons:
        play: "\uDB81\uDC0A"
        pause: "\uDB80\uDFE4"
        prev_track: "\uDB81\uDCAE"
        next_track: "\uDB81\uDCAD"
      label_shadow:
        enabled: false
        color: black
        radius: 1
        offset:
        - 1
        - 1
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%d %b - %H:%M}'
      label_alt: '{%d %b - %H:%M}'
      timezones: []
      update_interval: 1000
      calendar:
        alignment: right
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: '#3a3a3a'
        direction: down
        show_holidays: true
        show_week_numbers: false
        holiday_color: '#a8a8a8'
      callbacks:
        on_left: toggle_calendar
        on_middle: do_nothing
        on_right: toggle_label
      label_shadow:
        enabled: false
        color: black
        radius: 1
        offset:
        - 1
        - 1
      locale: en_US
  weather:
    type: yasb.weather.WeatherWidget
    options:
      label: <span>{icon}</span> {temp}
      label_alt: '<span>{icon}</span> {location}: {conditions}, {temp}'
      api_key: ""
      update_interval: 300
      hide_decimal: true
      location: Adelaide
      units: metric
      callbacks:
        on_left: toggle_card
        on_right: toggle_label
      icons:
        sunnyDay: "\uDB81\uDD99"
        clearNight: "\uE3C2"
        cloudyDay: "\uE21D"
        cloudyNight: "\uE226"
        rainyDay: "\uE371"
        rainyNight: "\uE371"
        snowyDay: "\uDB81\uDF17"
        snowyNight: "\uDB81\uDF17"
        blizzardDay: "\uDB81\uDD99"
        default: "\uDB81\uDD99"
      weather_card:
        show_hourly_forecast: true
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: '#3a3a3a'
        alignment: center
        direction: down
        offset_top: 6
        icon_size: 48
      label_shadow:
        enabled: false
        color: black
        radius: 1
        offset:
        - 1
        - 1
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: '{level}'
      label_alt: '{volume}'
      progress_bar:
        enabled: true
        position: left
        size: 14
        thickness: 2
        color: '#c9c9c9'
        background_color: '#242424'
      callbacks:
        on_right: exec cmd.exe /c start ms-settings:sound
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "\uF011"
      uptime: true
      blur: true
      blur_background: true
      animation_duration: 250
      button_row: 5
      buttons:
        shutdown:
        - "\uF011"
        - Shut Down
        restart:
        - "\uEAD2"
        - Restart
        signout:
        - "\uDB80\uDF43"
        - Sign out
        cancel:
        - "\uDB81\uDF3A"
        - Cancel
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[{win[process][name]}]'
      label_no_window: Desktop
      label_icon: true
      label_icon_size: 14
      max_length: 30
      max_length_ellipsis: '...'
      monitor_exclusive: true
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
      label_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  gpu:
    type: yasb.gpu.GpuWidget
    options:
      label: GPU
      label_alt: GPU {info[utilization]}%
      progress_bar:
        enabled: true
        position: left
        size: 14
        thickness: 2
        color: '#ffffff'
        background_color: '#242424'
      update_interval: 2000
      callbacks:
        on_left: toggle_label
        on_right: do_nothing
      gpu_thresholds:
        low: 25
        medium: 50
        high: 90
  wifi:
    type: yasb.wifi.WifiWidget
    options:
      label: '{wifi_icon}'
      label_alt: '{wifi_icon} {wifi_name}'
      update_interval: 5000
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: exec cmd.exe /c start ms-settings:network-wifi
      wifi_icons:
      - "\uDB82\uDD2E"
      - "\uDB82\uDD1F"
      - "\uDB82\uDD22"
      - "\uDB82\uDD25"
      - "\uDB82\uDD28"
      label_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  battery:
    type: yasb.battery.BatteryWidget
    options:
      label: '{icon} {percent}%'
      label_alt: '{icon} {percent}% {time_remaining}'
      time_remaining_natural: true
      hide_unsupported: true
      update_interval: 5000
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: exec cmd.exe /c start ms-settings:batterysaver
      charging_options:
        icon_format: '{charging_icon}'
        blink_charging_icon: true
        blink_interval: 500
      status_thresholds:
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: "\uDB80\uDC84"
        icon_critical: "\uDB80\uDC7A"
        icon_low: "\uDB80\uDC7C"
        icon_medium: "\uDB80\uDC7E"
        icon_high: "\uDB80\uDC82"
        icon_full: "\uDB80\uDC79"
      label_shadow:
        enabled: true
        color: black
        radius: 3
        offset:
        - 1
        - 1
  raycast_search:
    type: yasb.custom.CustomWidget
    options:
      class_name: raycast-search
      label: "<span>\uF002</span>"
      tooltip: true
      tooltip_label: Tìm kiếm · Alt+Space
      exec_options:
        use_shell: false
      callbacks:
        on_left: open_launcher
  control_center:
    type: yasb.control_center.ControlCenterWidget
    options:
      label: "<span>\uF1DE</span>"
      tooltip: true
      sections_order:
      - system_controls
      - quick_actions
      - sliders
      - power
      - media
      popup:
        alignment: right
        direction: down
        border_color: none
        round_corners: true
        blur: true
        round_corners_type: normal
        offset_top: 8
        offset_left: 0
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: default
          actions:
          - id: toggle_dnd
            label: Do Not Disturb
            icon: "\uF285"
          - id: toggle_mute
            label: Mute
            icon: "\uE74F"
          - id: toggle_mic_mute
            label: Mic Mute
            icon: "\uF12E"
          - id: screenshot
            label: Screenshot
            icon: "\uE91B"
          - id: touch_keyboard
            label: Keyboard
            icon: "\uE765"
          - id: bar_theme
            label: Theme
            icon: "\uE790"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\uE622"
            next_track: "\uE623"
            play: "\uF5B0"
            pause: "\uE62E"
        power:
          show: true
          power_plan_title: Power Plan
          power_mode_title: Power Mode
          button_menu_icon: "\uE76C"
      callbacks:
        on_left: toggle_menu
  komorebi_active_layout:
    type: komorebi.active_layout.ActiveLayoutWidget
    options:
      hide_if_offline: true
      label: '{layout_name}'
      layouts:
      - bsp
      - columns
      - rows
      - grid
      - vertical_stack
      - horizontal_stack
      - ultrawide_vertical_stack
      - right_main_vertical_stack
      layout_icons:
        bsp: "\uEBEB"
        columns: "\uEBF7"
        rows: "\uEC01"
        grid: "\uDB81\uDF58"
        scrolling: "\uEBF7"
        vertical_stack: "\uEBEE"
        horizontal_stack: "\uEBF0"
        ultrawide_vertical_stack: "\uEBEE"
        right_main_vertical_stack: "\uEBF1"
        monocle: "\uF06F"
        maximized: "\uF06F"
        floating: "\uF2D2"
        paused: "\uDB83\uDF89"
        tiling: "\uDB81\uDE40"
      callbacks:
        on_left: toggle_layout_menu
        on_middle: next_layout
        on_right: prev_layout
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: '#3a3a3a'
        alignment: left
        direction: down
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  bar_divider:
    type: yasb.custom.CustomWidget
    options:
      class_name: bar-divider
      label: '|'
      label_alt: '|'
      callbacks:
        on_left: do_nothing
        on_right: do_nothing

# Keep the pinned runtime paired with patches/manifest.json.
update_check: false
